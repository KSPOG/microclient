name: Build Microbot with RuneLite 1.13.6
on:
  push:
    branches: [update/runelite-1.13.6]
  workflow_dispatch:

concurrency:
  group: microclient-runelite-1.13.6
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-24.04
    steps:
      - name: Stop the superseded build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          route="repos/$GITHUB_REPOSITORY/actions/runs/43962248159"
          if [ "$(gh api "$route" --jq .status)" != completed ]; then
            if ! gh api -X POST "$route/cancel"; then
              test "$(gh api "$route" --jq .status)" = completed
            fi
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Apply upstream release changes
        shell: bash
        run: |
          git fetch --no-tags --depth=1 https://github.com/runelite/runelite.git \
            refs/tags/runelite-parent-1.12.38:refs/tags/runelite-parent-1.12.38 \
            refs/tags/runelite-parent-1.13.6:refs/tags/runelite-parent-1.13.6
          test "$(git rev-parse refs/tags/runelite-parent-1.12.38)" = 5adc77c0169658ac6115c46215f7428acdf92a55
          test "$(git rev-parse refs/tags/runelite-parent-1.13.6)" = 451c5ac96f7b82fa02ce46a7df812b0714782477
          git diff --binary runelite-parent-1.12.38 runelite-parent-1.13.6 -- . ':!.github' ':!gradle.properties' > "$RUNNER_TEMP/runelite.patch"
          conflicts=$(git apply --3way "$RUNNER_TEMP/runelite.patch" 2>&1) || true
          printf '%s\n' "$conflicts"
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflict-paths"
          python3 - <<'PY'
