n's\",\"\\t * data directory on the first call of {@code getPluginDirectory}\",\"\\t */\",\"\\tprotected final Filepath getPluginDirectory() throws IOException\",\"\\t{\",\"\\t\\tvar desc = getClass().getAnnotation(PluginDescriptor.class);\",\"\",\"\\t\\tvar internalName = desc.internalName();\",\"\\t\\tif (Strings.isNullOrEmpty(internalName))\",\"\\t\\t{\",\"\\t\\t\\tthrow new IllegalArgumentException(\\\"internalName must be set in @PluginDescriptor.\\\");\",\"\\t\\t}\",\"\",\"\\t\\tif (!Files.exists(RuneLite.PLUGIN_DATA))\",\"\\t\\t{\",\"\\t\\t\\ttry\",\"\\t\\t\\t{\",\"\\t\\t\\t\\tFiles.createDirectories(RuneLite.PLUGIN_DATA);\",\"\\t\\t\\t}\",\"\\t\\t\\tcatch (FileNotFoundException ignored)\",\"\\t\\t\\t{\",\"\\t\\t\\t}\",\"\\t\\t}\",\"\",\"\\t\\tvar fp = Filepath.Unchecked.getRooted(RuneLite.PLUGIN_DATA)\",\"\\t\\t\\t.joinSegment(internalName)\",\"\\t\\t\\t.rooted();\",\"\",\"\\t\\tvar legacyName = desc.legacyDataDirectory();\",\"\\t\\tif (!Strings.isNullOrEmpty(legacyName))\",\"\\t\\t{\",\"\\t\\t\\tvar legacy = Filepath.Unchecked.getLegacyPluginDirectory(RuneLite.RUNELITE_DIR.toPath(), legacyName);\",\"\",\"\\t\\t\\tif (!fp.exists() && legacy.exists())\",\"\\t\\t\\t{\",\"\\t\\t\\t\\tlegacy.moveTo(fp);\",\"\\t\\t\\t}\",\"\\t\\t}\",\"\",\"\\t\\treturn fp;\"]],\"runelite-client/src/main/java/net/runelite/client/plugins/cannon/CannonPlugin.java\":[[\"\\tprivate boolean cannonDecayed;\",\"\",\"\\t@Getter\",\"\\tprivate static WorldArea cannonPosition;\"]],\"runelite-client/src/main/java/net/runelite/client/plugins/config/PluginHubPanel.java\":[[]],\"runelite-client/src/main/java/net/runelite/client/plugins/grounditems/GroundItem.java\":[[\"\\tpublic long getGePrice()\"]],\"runelite-client/src/test/java/net/runelite/client/plugins/PluginManagerTest.java\":[[\"\\t\\tvar pluginManager = new PluginManager(false, false, null, null, null, null, new PluginModuleFactory());\"],[\"\\t\\tPluginManager pluginManager = new PluginManager(true, false, null, null, null, null, new PluginModuleFactory());\"]]}")
          marker = re.compile(r"(?m)^<<<<<<< ours\n[\s\S]*?^=======\n[\s\S]*?^>>>>>>> theirs\n")
          for name, blocks in resolutions.items():
              path = Path(name)
              source = path.read_text()
              matches = list(marker.finditer(source))
              if len(matches) != len(blocks):
                  raise RuntimeError(f"{name}: expected {len(blocks)} conflicts, found {len(matches)}")
              for match, block in reversed(list(zip(matches, blocks))):
                  replacement = "\n".join(block) + ("\n" if block else "")
                  source = source[:match.start()] + replacement + source[match.end():]
              path.write_text(source)
          
