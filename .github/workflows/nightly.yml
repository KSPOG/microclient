name: Nightly release

on:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: development

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Build Shaded JAR
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          bash ./gradlew :client:shadowJar -Pmicrobot.commit.sha=$COMMIT_SHA

      - name: Read microbot.version from Gradle
        id: version
        run: |
          V=$(bash ./gradlew -q properties --console=plain | sed -n 's/^microbot.version: //p')
          if [ -z "$V" ]; then V=$(grep '^microbot.version=' gradle.properties | cut -d= -f2); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Using version: $V"

      - name: Prepare artifact name
        run: |
          SRC=$(echo runelite-client/build/libs/client-*-shaded.jar)
          DEST=runelite-client/build/libs/microbot-${{ steps.version.outputs.version }}.jar
          cp "$SRC" "$DEST"

      - name: Update nightly tag
        run: |
          git tag --force nightly
          git push origin refs/tags/nightly --force

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          prerelease: false
          name: Nightly Build
          fail_on_unmatched_files: true
          files: |
            runelite-client/build/libs/microbot-*.jar
